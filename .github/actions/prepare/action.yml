name: Prepare
description: Setup Bun, turbo cache, and install dependencies

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Turbo Cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
