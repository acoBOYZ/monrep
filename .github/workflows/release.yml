name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/prepare

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "skip notes — $TAG_NAME already exists"
          else
            bun run release:notes
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file "$RELEASE_NOTES_FILE"
          fi

  agent-binaries:
    name: Build monrep (${{ matrix.asset }})
    needs: [github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            asset: monrep-linux-x86_64
          - runs-on: ubuntu-24.04-arm
            asset: monrep-linux-aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/prepare

      - uses: ./.github/actions/prepare-rust
        with:
          working-directory: packages/agent

      - name: Build release binary
        working-directory: packages/agent
        run: bun run build

      - name: Stage asset
        run: |
          cp packages/agent/dist/monrep "${{ runner.temp }}/${{ matrix.asset }}"
          chmod +x "${{ runner.temp }}/${{ matrix.asset }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" "${{ runner.temp }}/${{ matrix.asset }}" --clobber
