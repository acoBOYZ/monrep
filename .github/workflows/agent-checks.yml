name: agent-checks

on:
  # push:
  #   branches:
  #     - main
  pull_request:

concurrency:
  group: agent-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmtcheck:
    name: fmtcheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/prepare-rust
        with:
          working-directory: packages/agent
      - name: Format check
        run: bun run fmtcheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/prepare-rust
        with:
          working-directory: packages/agent
      - name: Lint
        run: bun run lint:rust

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/prepare-rust
        with:
          working-directory: packages/agent
      - name: Typecheck
        env:
          RUSTFLAGS: -Dwarnings
        run: bun run typecheck:rust

  doctor:
    name: doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/prepare-rust
        with:
          working-directory: packages/agent
      - name: Doctor
        run: bun run doctor:rust

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/prepare-rust
        with:
          working-directory: packages/agent
      - name: Cargo test
        run: bun run test

  agent-checks-passed:
    if: always()
    name: agent-checks:required
    needs: [fmtcheck, lint, typecheck, doctor, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All agent CI jobs passed"
