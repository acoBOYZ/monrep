[package]
name = "agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "monrep outbound tunnel agent — 1:1 control plane, supervised runtime"

[[bin]]
name = "monrep"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fs-err = "3.3.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "time",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink"] }

[profile.release]
lto = "fat"
codegen-units = 1
debug = false
strip = true
panic = "abort"
overflow-checks = true
