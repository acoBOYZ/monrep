[package]
name = "agent"
version = "0.7.5"
edition = "2024"
publish = false
description = "monrep outbound tunnel agent — 1:1 control plane, supervised runtime"

[[bin]]
name = "monrep"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fs-err = "3.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.9"
portable-pty = "0.9.0"
base64 = "0.23.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2.190"

[profile.release]
lto = "fat"
codegen-units = 1
debug = false
strip = true
panic = "abort"
overflow-checks = true
